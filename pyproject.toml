[project]
name = "smtp-envelope-sender-parser"
version = "0.1.1"
description = "Parses SMTP MAIL FROM and RCPT TO arguments into address and ESMTP parameters, removing source routes."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
